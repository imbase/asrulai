<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASRUL AI 美股雷达 · 每日榜单</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --orange: #d29922;
    --red: #f85149;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    min-height: 100vh;
    line-height: 1.6;
  }
  .container { max-width: 960px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: 0.5px; }
  h1 .radar-icon { color: var(--accent); }
  .date-nav { display: flex; align-items: center; gap: 8px; }
  .date-nav button {
    background: var(--bg-card); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 14px;
  }
  .date-nav button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .date-nav button:disabled { opacity: 0.35; cursor: default; }
  #currentDate { font-size: 15px; color: var(--text-dim); min-width: 100px; text-align: center; }
  .meta { color: var(--text-dim); font-size: 13px; margin-bottom: 20px; }
  .sample-banner {
    background: rgba(210, 153, 34, 0.12); border: 1px solid var(--orange);
    color: var(--orange); border-radius: 8px; padding: 10px 14px;
    font-size: 13px; margin-bottom: 20px;
  }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab {
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 8px; padding: 8px 18px; cursor: pointer; font-size: 14px; transition: all .15s;
  }
  .tab.active { border-color: var(--accent); color: var(--accent); background: rgba(88, 166, 255, 0.08); font-weight: 600; }
  .tab:hover:not(.active) { color: var(--text); }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 12px 16px; color: var(--text-dim); font-weight: 500; border-bottom: 1px solid var(--border); font-size: 13px; white-space: nowrap; }
  td { padding: 12px 16px; border-bottom: 1px solid rgba(48, 54, 61, 0.5); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(88, 166, 255, 0.04); }
  .rank { font-weight: 700; color: var(--text-dim); width: 44px; }
  .rank.top { color: var(--accent); }
  .code { font-family: "SF Mono", Consolas, monospace; color: var(--text-dim); font-size: 13px; }
  .score-wrap { display: flex; align-items: center; gap: 10px; min-width: 120px; }
  .score-num { font-weight: 700; font-variant-numeric: tabular-nums; width: 44px; }
  .score-bar { height: 6px; border-radius: 3px; background: var(--border); flex: 1; overflow: hidden; }
  .score-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--green)); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { background: rgba(88, 166, 255, 0.1); color: var(--accent); border-radius: 10px; padding: 2px 10px; font-size: 12px; white-space: nowrap; }
  .reason { color: var(--text-dim); font-size: 13px; }
  .empty { padding: 60px 20px; text-align: center; color: var(--text-dim); }
  .disclaimer {
    margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border);
    color: var(--text-dim); font-size: 12px; text-align: center;
  }
  .loading { padding: 60px 20px; text-align: center; color: var(--text-dim); }
  @media (max-width: 640px) {
    .reason-col, .tags-col { display: none; }
    h1 { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1><span class="radar-icon">◉</span> ASRUL AI 美股雷达 · 每日榜单</h1>
    <div class="date-nav">
      <button id="prevBtn" title="前一天">‹</button>
      <span id="currentDate">加载中…</span>
      <button id="nextBtn" title="后一天">›</button>
      <button id="latestBtn">回到最新</button>
    </div>
  </header>
  <div class="meta" id="meta"></div>
  <div id="sampleBanner" class="sample-banner" style="display:none">
    ⚠ 当前展示的是示例数据，用于演示页面样式。接入真实雷达后，此提示会自动消失。
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="card" id="board"><div class="loading">正在加载榜单…</div></div>
  <div class="disclaimer">
    本榜单由 ASRUL AI 量化雷达程序自动生成，仅为数据筛选结果展示，不构成任何投资建议。股市有风险，投资需谨慎。
  </div>
</div>

<script>
(function () {
  var state = { data: null, radarIndex: 0, latestDate: null };

  function fmtDate(d) {
    var y = d.getFullYear(), m = ('0' + (d.getMonth() + 1)).slice(-2), dd = ('0' + d.getDate()).slice(-2);
    return y + '-' + m + '-' + dd;
  }

  function load(dateStr) {
    document.getElementById('board').innerHTML = '<div class="loading">正在加载榜单…</div>';
    fetch('data/' + dateStr + '.json')
      .then(function (r) {
        if (!r.ok) throw new Error('404');
        return r.json();
      })
      .then(function (data) {
        state.data = data;
        state.radarIndex = 0;
        render();
      })
      .catch(function () {
        document.getElementById('currentDate').textContent = dateStr;
        document.getElementById('meta').textContent = '';
        document.getElementById('sampleBanner').style.display = 'none';
        document.getElementById('tabs').innerHTML = '';
        document.getElementById('board').innerHTML = '<div class="empty">该日期暂无榜单数据（美股休市日无更新）。</div>';
        updateNav(dateStr);
      });
  }

  function render() {
    var d = state.data;
    document.getElementById('currentDate').textContent = d.date;
    document.getElementById('meta').textContent = '生成时间：' + (d.generated_at || '—') + (d.market ? ' · 市场：' + d.market : '');
    document.getElementById('sampleBanner').style.display = d.sample ? 'block' : 'none';
    updateNav(d.date);

    var tabsEl = document.getElementById('tabs');
    tabsEl.innerHTML = '';
    (d.radars || []).forEach(function (radar, i) {
      var btn = document.createElement('button');
      btn.className = 'tab' + (i === state.radarIndex ? ' active' : '');
      btn.textContent = radar.name;
      btn.onclick = function () { state.radarIndex = i; render(); };
      tabsEl.appendChild(btn);
    });

    var radar = (d.radars || [])[state.radarIndex];
    var board = document.getElementById('board');
    if (!radar || !radar.picks || radar.picks.length === 0) {
      board.innerHTML = '<div class="empty">今日该雷达暂无入选个股。</div>';
      return;
    }
    var maxScore = Math.max.apply(null, radar.picks.map(function (p) { return p.score || 0; }));
    var rows = radar.picks.map(function (p) {
      var pct = maxScore > 0 ? Math.round((p.score || 0) / maxScore * 100) : 0;
      var tags = (p.tags || []).map(function (t) { return '<span class="tag">' + escapeHtml(t) + '</span>'; }).join('');
      return '<tr>' +
        '<td class="rank' + (p.rank <= 3 ? ' top' : '') + '">' + (p.rank || '—') + '</td>' +
        '<td><div>' + escapeHtml(p.name || '') + '</div><div class="code">' + escapeHtml(p.code || '') + '</div></td>' +
        '<td><div class="score-wrap"><span class="score-num">' + (p.score != null ? p.score : '—') + '</span>' +
        '<div class="score-bar"><div class="score-fill" style="width:' + pct + '%"></div></div></div></td>' +
        '<td class="reason reason-col">' + escapeHtml(p.reason || '—') + '</td>' +
        '<td class="tags-col"><div class="tags">' + (tags || '—') + '</div></td>' +
        '</tr>';
    }).join('');
    board.innerHTML = '<table><thead><tr><th>#</th><th>股票</th><th>评分</th><th class="reason-col">入选理由</th><th class="tags-col">标签</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function updateNav(dateStr) {
    var prev = new Date(dateStr + 'T00:00:00');
    prev.setDate(prev.getDate() - 1);
    document.getElementById('prevBtn').onclick = function () { load(fmtDate(prev)); };
    var isLatest = dateStr === state.latestDate;
    var next = new Date(dateStr + 'T00:00:00');
    next.setDate(next.getDate() + 1);
    var nextBtn = document.getElementById('nextBtn');
    nextBtn.disabled = isLatest;
    nextBtn.onclick = function () { load(fmtDate(next)); };
    document.getElementById('latestBtn').disabled = isLatest;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  fetch('data/latest.json')
    .then(function (r) { return r.json(); })
    .then(function (latest) {
      state.latestDate = latest.date;
      load(latest.date);
    })
    .catch(function () {
      document.getElementById('board').innerHTML = '<div class="empty">暂未发布任何榜单。</div>';
      document.getElementById('currentDate').textContent = '—';
    });
})();
</script>
</body>
</html>
